<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doces Lira – Faça seu pedido</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f4;--card:#fff;--ink:#4a2318;--muted:#8a6a62;--pink:#f9c6d6;--rose:#d9809f;--line:#f0d3dc;--ok:#1e7d3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1612;--card:#3a201a;--ink:#ffe9ef;--muted:#d1aab4;--pink:#6b3446;--rose:#f2a3bd;--line:#55302b;--ok:#7be0a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;padding-bottom:120px}
main{max-width:560px;margin:0 auto;padding:0 18px}
header{text-align:center;padding:36px 0 18px}
header small{font-size:1rem;color:var(--muted)}
h1{font-family:Sacramento,cursive;font-weight:400;font-size:4.4rem;line-height:1;margin:0}
header p{margin:8px 0 0;color:var(--muted)}
h2{display:inline-block;background:var(--pink);padding:6px 18px;border-radius:99px;font-size:1.05rem;letter-spacing:.18em;margin:26px 0 6px}
.promo{margin:0 0 12px;color:var(--ok);font-weight:500;font-size:.95rem}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.item .n{flex:1}
.item .n b{display:block;font-weight:500}
.item .n span{color:var(--muted);font-size:.9rem}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:36px;height:36px;border-radius:50%;border:0;background:var(--pink);color:var(--ink);font-size:1.3rem;font-weight:600;cursor:pointer}
.qty button.add{background:var(--ink);color:var(--bg)}
.qty output{min-width:18px;text-align:center;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar button{display:flex;justify-content:space-between;width:100%;max-width:560px;margin:0 auto;border:0;border-radius:99px;background:#25a244;color:#fff;font:600 1.05rem Outfit,sans-serif;padding:16px 24px;cursor:pointer}
.bar button:disabled{background:var(--line);color:var(--muted);cursor:default}
dialog{border:0;border-radius:22px;background:var(--bg);color:var(--ink);width:min(92vw,520px);padding:22px;max-height:90vh}
dialog::backdrop{background:#0008}
dialog h3{font-family:Sacramento,cursive;font-weight:400;font-size:2.4rem;margin:0 0 10px}
.lines{margin:0 0 14px;padding:0;list-style:none}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.lines li.grupo{color:var(--ok);font-weight:500}
.total{display:flex;justify-content:space-between;font-weight:600;font-size:1.15rem;margin-bottom:6px}
.aviso{font-size:.85rem;color:var(--muted);margin:0 0 8px}
label{display:block;font-size:.9rem;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:11px 12px}
input.erro{border-color:#d33}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;border:0;border-radius:99px;padding:14px;font:600 1rem Outfit,sans-serif;cursor:pointer}
.back{background:var(--pink);color:var(--ink)}
.send{background:#25a244;color:#fff;flex:2!important}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:26px 0}
</style>
</head>
<body>
<main>
  <header>
    <small>confeitaria</small>
    <h1>Doces Lira</h1>
    <p>Escolha seus doces e envie o pedido pelo WhatsApp. Atendemos por entrega.</p>
  </header>
  <div id="menu"></div>
  <footer>Pedidos: (11) 96298-3072</footer>
</main>

<div class="bar">
  <button id="open" disabled><span id="count">Escolha seus doces</span><span id="sum"></span></button>
</div>

<dialog id="dlg">
  <h3>Seu pedido</h3>
  <ul class="lines" id="lines"></ul>
  <div class="total"><span>Total</span><span id="total"></span></div>
  <p class="aviso">Entrega: o valor do frete é combinado pelo WhatsApp.</p>

  <label for="nome">Seu nome</label>
  <input id="nome" autocomplete="name" placeholder="Como podemos te chamar?">

  <label for="end">Endereço de entrega</label>
  <input id="end" autocomplete="street-address" placeholder="Rua, número, bairro e complemento">

  <label for="obs">Observações (opcional)</label>
  <textarea id="obs" rows="2" placeholder="Data, horário, recados…"></textarea>

  <div class="actions">
    <button class="back" id="close">Voltar</button>
    <button class="send" id="send">Enviar pelo WhatsApp</button>
  </div>
</dialog>

<script>
const WHATS = "5511962983072";

// promo: a cada grupo fechado de "qtd" unidades (sabores misturados) paga-se "preco".
// Não é cumulativo: cada grupo vale sempre o mesmo preço. O que sobra paga preço normal.
const MENU = [
  {cat:"Trufas", tipo:"Trufa", promo:{qtd:3, preco:15},
   items:[["Maracujá trufado",6],["Brigadeiro",6],["Prestígio",6],["Mousse de limão",6],["Surpresa de uva",6.5],["Oreo",6]]},
  {cat:"Cones", tipo:"Cone", promo:{qtd:2, preco:18},
   items:[["Maracujá trufado",10],["Brigadeiro",10],["Paçoca",10],["Ninho com Nutella",10],["Oreo",10],["Prestígio",10],["Ninho",10]]}
];

const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const cart = {};
const flat = [];
const menuEl = document.getElementById("menu");

MENU.forEach((g,gi)=>{
  const h = document.createElement("h2");
  h.textContent = g.cat;
  menuEl.appendChild(h);

  const p = document.createElement("p");
  p.className = "promo";
  p.id = "promo"+gi;
  menuEl.appendChild(p);

  g.items.forEach(([name,price])=>{
    const id = flat.length;
    flat.push({id, gi, tipo:g.tipo, name, price});
    const d = document.createElement("div");
    d.className = "item";
    d.innerHTML = `<div class="n"><b>${name}</b><span>${brl(price)}</span></div>
      <div class="qty">
        <button aria-label="Remover ${name}" data-d="-1" data-id="${id}" hidden>−</button>
        <output id="q${id}" hidden>0</output>
        <button class="add" aria-label="Adicionar ${name}" data-d="1" data-id="${id}">+</button>
      </div>`;
    menuEl.appendChild(d);
  });
});

menuEl.addEventListener("click", e=>{
  const b = e.target.closest("button[data-id]");
  if(!b) return;
  const id = +b.dataset.id;
  cart[id] = Math.max(0,(cart[id]||0) + +b.dataset.d);
  render();
});

// Cálculo por categoria:
// grupos = floor(unidades / qtd)  → cada grupo custa promo.preco
// sobra  = unidades % qtd         → cada unidade paga o preço normal
function calcular(){
  let total = 0, itens = 0;
  const cats = [];
  MENU.forEach((g,gi)=>{
    const unidades = [];
    flat.filter(i=>i.gi===gi).forEach(i=>{
      for(let k=0;k<(cart[i.id]||0);k++) unidades.push(i.price);
    });
    unidades.sort((a,b)=>b-a);                 // as de maior valor entram nos grupos (favorece o cliente)
    const n = unidades.length;
    const grupos = Math.floor(n / g.promo.qtd);
    const resto = unidades.slice(grupos * g.promo.qtd);
    const valorGrupos = grupos * g.promo.preco;
    const valorResto = resto.reduce((a,b)=>a+b,0);
    total += valorGrupos + valorResto;
    itens += n;
    cats.push({gi, n, grupos, sobra: resto.length, valorGrupos, valorResto});
  });
  return {total, itens, cats};
}

function render(){
  flat.forEach(it=>{
    const q = cart[it.id]||0;
    const o = document.getElementById("q"+it.id);
    o.textContent = q;
    o.hidden = !q;
    o.previousElementSibling.hidden = !q;
  });

  const r = calcular();

  MENU.forEach((g,gi)=>{
    const c = r.cats[gi];
    const base = `Promoção: a cada ${g.promo.qtd} por ${brl(g.promo.preco)} (sabores misturados)`;
    const falta = c.sobra ? g.promo.qtd - c.sobra : 0;
    document.getElementById("promo"+gi).textContent =
      falta ? `${base}. Falta ${falta} para fechar mais um grupo!` : base;
  });

  document.getElementById("open").disabled = !r.itens;
  document.getElementById("count").textContent = r.itens ? `Ver pedido (${r.itens} ${r.itens>1?"itens":"item"})` : "Escolha seus doces";
  document.getElementById("sum").textContent = r.itens ? brl(r.total) : "";
}

const dlg = document.getElementById("dlg");

document.getElementById("open").onclick = ()=>{
  const ul = document.getElementById("lines");
  ul.innerHTML = "";
  const r = calcular();

  flat.filter(i=>cart[i.id]).forEach(i=>{
    const li = document.createElement("li");
    li.textContent = `${cart[i.id]}x ${i.name} (${i.tipo})`;
    ul.appendChild(li);
  });

  r.cats.forEach(c=>{
    if(!c.n) return;
    const g = MENU[c.gi];
    if(c.grupos){
      const li = document.createElement("li");
      li.className = "grupo";
      li.innerHTML = `<span>${c.grupos}x promoção ${g.promo.qtd} ${g.cat.toLowerCase()} por ${brl(g.promo.preco)}</span><span>${brl(c.valorGrupos)}</span>`;
      ul.appendChild(li);
    }
    if(c.sobra){
      const li = document.createElement("li");
      li.innerHTML = `<span>${c.sobra} ${g.cat.toLowerCase()} avulsa${c.sobra>1?"s":""}</span><span>${brl(c.valorResto)}</span>`;
      ul.appendChild(li);
    }
  });

  document.getElementById("total").textContent = brl(r.total);
  dlg.showModal();
};

document.getElementById("close").onclick = ()=>dlg.close();

document.getElementById("send").onclick = ()=>{
  const nome = document.getElementById("nome");
  const end  = document.getElementById("end");
  const obs  = document.getElementById("obs").value.trim();
  [nome,end].forEach(el=>el.classList.toggle("erro", !el.value.trim()));
  if(!nome.value.trim()) { nome.focus(); return; }
  if(!end.value.trim())  { end.focus();  return; }

  const r = calcular();
  const itens = flat.filter(i=>cart[i.id]).map(i=>`• ${cart[i.id]}x ${i.name} (${i.tipo})`);

  const valores = [];
  r.cats.forEach(c=>{
    if(!c.n) return;
    const g = MENU[c.gi];
    if(c.grupos) valores.push(`🎉 ${c.grupos}x promoção ${g.promo.qtd} ${g.cat.toLowerCase()} por ${brl(g.promo.preco)} = ${brl(c.valorGrupos)}`);
    if(c.sobra)  valores.push(`${c.sobra} ${g.cat.toLowerCase()} avulsa${c.sobra>1?"s":""} = ${brl(c.valorResto)}`);
  });

  const msg =
`Olá, Doces Lira! Gostaria de fazer um pedido:

${itens.join("\n")}

${valores.join("\n")}

*Total dos doces: ${brl(r.total)}* (frete a combinar)

Nome: ${nome.value.trim()}
Entrega em: ${end.value.trim()}` + (obs ? `\nObservações: ${obs}` : "");

  window.open(`https://wa.me/${WHATS}?text=${encodeURIComponent(msg)}`, "_blank");
};

render();
</script>
</body>
</html>
